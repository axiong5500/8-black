<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8-black · 桌面图标台球</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23157a4c'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f4f1e8'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1410; --panel:#1b231c; --line:#2e3a30; --text:#eef3ee; --muted:#9db3a3;
    --accent:#35c47f; --accent-2:#f4f1e8; --danger:#e0655a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 700px at 50% -10%, #1c2b20, var(--bg) 70%);
    color:var(--text); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100%; padding:16px;
  }
  header{width:100%; max-width:960px; text-align:center; margin-bottom:12px}
  header h1{font-size:22px; letter-spacing:.5px}
  header p{color:var(--muted); font-size:14px; margin-top:4px}
  .stage{position:relative; width:100%; max-width:960px}
  canvas{display:block; width:100%; height:auto; border-radius:14px; background:#143524; box-shadow:0 18px 50px rgba(0,0,0,.5); cursor:crosshair; touch-action:none}
  .hud{
    width:100%; max-width:960px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    justify-content:space-between; margin-top:12px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:10px 14px;
  }
  .stats{display:flex; gap:18px; flex-wrap:wrap; font-size:14px}
  .stats b{color:var(--accent-2); font-variant-numeric:tabular-nums}
  .controls{display:flex; gap:8px; flex-wrap:wrap}
  button{
    background:#26332a; color:var(--text); border:1px solid var(--line); border-radius:9px;
    padding:8px 14px; font-size:14px; cursor:pointer; min-height:40px;
  }
  button:hover{background:#314337}
  button.primary{background:var(--accent); color:#08150e; border-color:var(--accent); font-weight:600}
  button.primary:hover{filter:brightness(1.08)}
  .tip{width:100%; max-width:960px; color:var(--muted); font-size:13px; margin-top:10px; line-height:1.7}
  .tip kbd{background:#26332a; border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:12px}
  /* 结算遮罩 */
  .overlay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center; border-radius:14px;
    background:rgba(10,16,11,.72); backdrop-filter:blur(3px);
  }
  .overlay.show{display:flex}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:26px 30px;
    text-align:center; max-width:340px; width:90%;
  }
  .card h2{font-size:20px; margin-bottom:8px}
  .card p{color:var(--muted); font-size:14px; line-height:1.8}
  .card .big{font-size:30px; color:var(--accent); font-weight:700; margin:10px 0}
  .card .row{display:flex; gap:16px; justify-content:center; margin:14px 0; font-size:14px}
  .card .row span{color:var(--muted)}
  .card .row b{display:block; color:var(--text); font-size:18px}
</style>
</head>
<body>
<header>
  <h1>8-black · 桌面图标台球</h1>
  <p>把桌面上的小图标摆成一局台球，浏览器里直接开打，不用装任何东西。</p>
</header>

<div class="stage">
  <canvas id="table" width="960" height="600"></canvas>
  <div class="overlay" id="overlay">
    <div class="card" id="card">
      <h2>清台啦！</h2>
      <div class="big" id="finalTime">00:00</div>
      <div class="row">
        <div><span>入袋图标</span><b id="finalPotted">0</b></div>
        <div><span>击球次数</span><b id="finalShots">0</b></div>
        <div><span>平均/颗</span><b id="finalAvg">0.0s</b></div>
      </div>
      <p>再来一局？点下面按钮重新摆球。</p>
      <div class="controls" style="justify-content:center;margin-top:16px">
        <button class="primary" id="againBtn">重新开球</button>
      </div>
    </div>
  </div>
</div>

<div class="hud">
  <div class="stats">
    <div>用时 <b id="statTime">00:00.0</b></div>
    <div>已入袋 <b id="statPotted">0</b></div>
    <div>剩余 <b id="statLeft">0</b></div>
    <div>击球 <b id="statShots">0</b></div>
  </div>
  <div class="controls">
    <button id="aimBtn">辅助线：开</button>
    <button id="restartBtn">重新开始</button>
  </div>
</div>

<p class="tip">
  <b>怎么玩（大白话）：</b>移动鼠标对准方向，<b>按住左键蓄力</b>，松手把白球打出去；白球撞图标、图标碰库反弹，把图标撞进四个角的袋子就算得分。白线是出球方向，蓝线是碰库反弹后的路线，绿线是被撞图标大概会滚的方向；如果预测路线能进某个袋口，袋口会标出红圈。按 <kbd>Esc</kbd> 或点「重新开始」可以重开。
</p>

<script>
/* ================= 常量与状态 ================= */
const canvas = document.getElementById('table');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const POCKET_R = 26;                 // 袋口半径
const BALL_R = 18;                   // 球半径
const CUSHION = 26;                  // 库边内缩
const FRICTION = 0.985;              // 滚动摩擦
const REST_SPEED = 0.06;             // 停球阈值
const MAX_POWER = 26;                // 满力初速度

const POCKETS = [
  {x:CUSHION, y:CUSHION}, {x:W-CUSHION, y:CUSHION},
  {x:CUSHION, y:H-CUSHION}, {x:W-CUSHION, y:H-CUSHION}
];

// 模拟“桌面图标”：emoji + 底色，浏览器内联生成，不读真实桌面
const ICONS = [
  {e:'📁', c:'#e8b84b'}, {e:'🗑️', c:'#8b93a1'}, {e:'🌐', c:'#4b8fe8'},
  {e:'📝', c:'#f2f2f2'}, {e:'🎵', c:'#e86b9b'}, {e:'🖼️', c:'#57b98a'},
  {e:'💬', c:'#5ac8e8'}, {e:'📦', c:'#c98a5a'}, {e:'🎮', c:'#9b7be8'},
  {e:'🧮', c:'#e8e06b'}, {e:'🗂️', c:'#6bb3e8'}, {e:'📌', c:'#e87b6b'},
  {e:'🔧', c:'#9aa7b5'}, {e:'📷', c:'#7bb5c9'}, {e:'🎬', c:'#c97b9b'},
  {e:'🧭', c:'#6bc9a8'}, {e:'📡', c:'#b5c96b'}, {e:'🗃️', c:'#8a9bc9'},
  {e:'💾', c:'#c9c9c9'}, {e:'🔍', c:'#6bb3c9'}, {e:'🎨', c:'#e8a36b'},
  {e:'📊', c:'#6b9be8'}, {e:'🧩', c:'#e86bb3'}, {e:'🌙', c:'#7b8ac9'}
];

let balls = [];          // 所有球（白球 + 图标球）
let cue = null;          // 白球引用
let aiming = false;      // 是否正在蓄力
let power = 0;           // 当前力度 0..1
let holdStart = 0;       // 蓄力按下的时间戳
let aimAngle = 0;
let showAid = true;
let shots = 0, potted = 0;
let startTime = null;    // 第一杆击出才计时
let elapsed = 0;
let raf = null;
let particles = [];

/* ================= 工具函数 ================= */
const rand = (a,b)=>a+Math.random()*(b-a);
function dist(ax,ay,bx,by){return Math.hypot(ax-bx, ay-by);}
function fmtTime(ms){
  const t = Math.max(0, ms/1000);
  const m = Math.floor(t/60), s = Math.floor(t%60), d = Math.floor((t*10)%10);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+d;
}

/* ================= 开局摆球 ================= */
function buildRack(){
  balls = []; particles = [];
  shots = 0; potted = 0; power = 0; aiming = false;
  startTime = null; elapsed = 0;

  // 白球摆在左下区域
  cue = {x: W*0.18, y: H*0.72, vx:0, vy:0, r:BALL_R, cue:true, emoji:'⚪', color:'#f4f1e8', active:true};
  balls.push(cue);

  // 图标球按三角堆摆在右侧
  const count = 15;
  const rows = 5;
  const originX = W*0.66, originY = H*0.32;
  const gap = BALL_R*2 + 6;
  let idx = 0;
  for(let r=0; r<rows && idx<count; r++){
    for(let c=0; c<=r && idx<count; c++){
      const icon = ICONS[idx % ICONS.length];
      balls.push({
        x: originX + c*gap - r*gap/2, y: originY + r*gap*0.86,
        vx:0, vy:0, r:BALL_R, cue:false,
        emoji:icon.e, color:icon.c, active:true
      });
      idx++;
    }
  }
  updateHud();
}

/* ================= 物理更新 ================= */
function stepPhysics(){
  let moving = false;

  for(const b of balls){
    if(!b.active) continue;
    b.x += b.vx; b.y += b.vy;
    b.vx *= FRICTION; b.vy *= FRICTION;
    if(Math.hypot(b.vx,b.vy) < REST_SPEED){ b.vx = 0; b.vy = 0; }
    else moving = true;

    // 碰库反弹
    if(b.x < CUSHION+b.r){ b.x = CUSHION+b.r; b.vx = Math.abs(b.vx)*0.86; }
    if(b.x > W-CUSHION-b.r){ b.x = W-CUSHION-b.r; b.vx = -Math.abs(b.vx)*0.86; }
    if(b.y < CUSHION+b.r){ b.y = CUSHION+b.r; b.vy = Math.abs(b.vy)*0.86; }
    if(b.y > H-CUSHION-b.r){ b.y = H-CUSHION-b.r; b.vy = -Math.abs(b.vy)*0.86; }

    // 入袋判定
    for(const p of POCKETS){
      if(dist(b.x,b.y,p.x,p.y) < POCKET_R*0.9){
        if(b.cue){ respawnCue(); }
        else { b.active = false; potted++; spawnRipple(p.x,p.y); }
        break;
      }
    }
  }

  // 球与球碰撞
  for(let i=0;i<balls.length;i++){
    const a = balls[i]; if(!a.active) continue;
    for(let j=i+1;j<balls.length;j++){
      const b = balls[j]; if(!b.active) continue;
      const dx = b.x-a.x, dy = b.y-a.y;
      const d = Math.hypot(dx,dy), min = a.r+b.r;
      if(d>0 && d<min){
        const nx = dx/d, ny = dy/d;
        const overlap = min-d;
        a.x -= nx*overlap/2; a.y -= ny*overlap/2;
        b.x += nx*overlap/2; b.y += ny*overlap/2;
        // 一维弹性碰撞（等质量）
        const va = a.vx*nx+a.vy*ny, vb = b.vx*nx+b.vy*ny;
        if(va-vb > 0){
          const diff = va-vb;
          a.vx -= nx*diff; a.vy -= ny*diff;
          b.vx += nx*diff; b.vy += ny*diff;
          spawnRipple((a.x+b.x)/2,(a.y+b.y)/2, '#ffffff');
        }
      }
    }
  }

  if(!moving && balls.some(b=>b.active && !b.cue)){
    // 所有球停住后才允许再击
  }
  return moving;
}

function respawnCue(){
  // 找一块空位摆回白球
  const spots = [{x:W*0.18,y:H*0.72},{x:W*0.2,y:H*0.3},{x:W*0.12,y:H*0.5}];
  for(const s of spots){
    const hit = balls.some(b=>b.active && !b.cue && dist(b.x,b.y,s.x,s.y) < BALL_R*3);
    if(!hit){ cue.x=s.x; cue.y=s.y; cue.vx=0; cue.vy=0; return; }
  }
  cue.x=W*0.18; cue.y=H*0.72; cue.vx=0; cue.vy=0;
}

/* ================= 粒子 / 涟漪 ================= */
function spawnRipple(x,y,color='rgba(255,255,255,.5)'){
  particles.push({x,y,r:6,life:1,color});
}
function stepParticles(){
  for(const pt of particles){ pt.r+=2.2; pt.life-=0.05; }
  particles = particles.filter(p=>p.life>0);
}

/* ================= 渲染 ================= */
function drawTable(){
  // 台面
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#1c4a30'); g.addColorStop(1,'#123521');
  ctx.fillStyle = g;
  roundRect(CUSHION-10, CUSHION-10, W-(CUSHION-10)*2, H-(CUSHION-10)*2, 18);
  ctx.fill();

  // 袋口
  for(const p of POCKETS){
    ctx.beginPath(); ctx.arc(p.x,p.y,POCKET_R,0,Math.PI*2);
    ctx.fillStyle='#0a0d0a'; ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle='#3a2a1a'; ctx.stroke();
  }

  // 辅助线
  if(showAid && cue.active && !ballsMoving()) drawAid();

  // 涟漪
  for(const pt of particles){
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);
    ctx.strokeStyle=pt.color; ctx.globalAlpha=pt.life; ctx.lineWidth=2; ctx.stroke();
    ctx.globalAlpha=1;
  }

  // 球
  for(const b of balls){
    if(!b.active) continue;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fillStyle=b.color; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.stroke();
    if(b.emoji){
      ctx.font = (b.r*1.1)+'px serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(b.emoji, b.x, b.y+1);
    }
  }

  // 力度条（蓄力中）
  if(aiming){
    const bw = 120, bh = 12;
    const bx = cue.x-bw/2, by = cue.y-BALL_R-24;
    ctx.fillStyle='rgba(0,0,0,.5)'; roundRect(bx-2,by-2,bw+4,bh+4,6); ctx.fill();
    ctx.fillStyle='#26332a'; roundRect(bx,by,bw,bh,5); ctx.fill();
    ctx.fillStyle = power>0.75?'#e0655a':'#35c47f';
    roundRect(bx,by,bw*power,bh,5); ctx.fill();
  }
}

function drawAid(){
  const a = aimAngle;
  ctx.lineWidth=2; ctx.setLineDash([8,6]);

  // 多跳反弹预测：逐段跟踪白球射线，记录经过的袋口（进洞点）
  let px=cue.x, py=cue.y, dx=Math.cos(a), dy=Math.sin(a);
  const segs = [];          // 每段 {x1,y1,x2,y2}
  let pocketHit = null;     // 路线经过的袋口
  let struck = null;         // 被撞到的图标球及其分离方向
  let guard = 0;

  while(guard++ < 8){
    const hit = traceToCollision(px,py,dx,dy);
    segs.push({x1:px,y1:py,x2:hit.x,y2:hit.y});

    // 该段是否穿过某个袋口（用段上最近点到袋心距离判断，放宽到半个球径）
    for(const p of POCKETS){
      const near = closestOnSegment(px,py,hit.x,hit.y,p.x,p.y);
      if(dist(near.x,near.y,p.x,p.y) < POCKET_R+BALL_R*0.6){ pocketHit = p; break; }
    }
    if(pocketHit) break;

    if(hit.type==='cushion'){
      const n = hit.normal;
      const rdx = dx-2*(dx*n.x+dy*n.y)*n.x;
      const rdy = dy-2*(dx*n.x+dy*n.y)*n.y;
      px=hit.x; py=hit.y; dx=rdx; dy=rdy;
    } else if(hit.ball){
      // 等质量弹性碰撞：连心线方向为 n，沿 n 方向的速度在两球间交换
      const bx=hit.ball.x, by=hit.ball.y;
      const nlen=dist(px,py,bx,by)||1;
      const nx=(bx-px)/nlen, ny=(by-py)/nlen;
      const vn=dx*nx+dy*ny;                 // 入射速度在连心线上的分量
      // 被撞球沿连心线方向走（绿线）
      struck = {x:bx, y:by, dx:nx, dy:ny};
      // 白球碰撞后的分离方向（切向保留）：原方向减去连心线方向分量
      const cdx=dx-vn*nx, cdy=dy-vn*ny;
      const clen=Math.hypot(cdx,cdy);
      if(clen>0.05){ px=hit.x; py=hit.y; dx=cdx/clen; dy=cdy/clen; }
      break;
    } else {
      break;
    }
  }

  // 分段着色：白=出球段，蓝=反弹/分离段
  segs.forEach((s,i)=>{
    ctx.strokeStyle = i===0 ? 'rgba(255,255,255,.9)' : 'rgba(90,160,255,.85)';
    line(s.x1,s.y1,s.x2,s.y2);
  });

  // 被撞球走向（绿线）：沿两球连心线方向，并继续预测它碰库反弹与进袋。
  // 起点从球心沿连心线外推一个球半径，避免被白球出球线盖住。
  if(struck){
    let sx=struck.x+struck.dx*(BALL_R+4), sy=struck.y+struck.dy*(BALL_R+4), sdx=struck.dx, sdy=struck.dy;
    ctx.strokeStyle='rgba(90,220,140,.9)';
    let sg=0;
    while(sg++ < 5){
      const hit=traceToCollision(sx,sy,sdx,sdy);
      line(sx,sy,hit.x,hit.y);
      for(const p of POCKETS){
        const near=closestOnSegment(sx,sy,hit.x,hit.y,p.x,p.y);
        if(dist(near.x,near.y,p.x,p.y)<POCKET_R+BALL_R*0.6){ pocketHit=p; break; }
      }
      if(pocketHit) break;
      if(hit.type==='cushion'){
        const n=hit.normal;
        const vn=sdx*n.x+sdy*n.y;
        sdx=sdx-2*vn*n.x;
        sdy=sdy-2*vn*n.y;
        sx=hit.x; sy=hit.y;
      } else break;
    }
  }

  if(pocketHit){
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(pocketHit.x,pocketHit.y,POCKET_R+4,0,Math.PI*2);
    ctx.strokeStyle='rgba(224,101,90,.95)'; ctx.lineWidth=3; ctx.stroke();
    ctx.beginPath(); ctx.arc(pocketHit.x,pocketHit.y,5,0,Math.PI*2);
    ctx.fillStyle='rgba(224,101,90,.95)'; ctx.fill();
  }
  ctx.setLineDash([]);
}

// 点 (px,py) 在线段 (x1,y1)-(x2,y2) 上的最近点
function closestOnSegment(ax,ay,bx,by,px,py){
  const vx=bx-ax, vy=by-ay, wx=px-ax, wy=py-ay;
  const len2=vx*vx+vy*vy || 1;
  let t=(wx*vx+wy*vy)/len2;
  t=Math.max(0,Math.min(1,t));
  return {x:ax+vx*t, y:ay+vy*t};
}

function traceToCollision(ox,oy,dx,dy){
  // 碰库距离
  let tWall = Infinity, normal=null;
  if(dx>0){ const t=(W-CUSHION-BALL_R-ox)/dx; if(t>0&&t<tWall){tWall=t;normal={x:-1,y:0};} }
  if(dx<0){ const t=(CUSHION+BALL_R-ox)/dx; if(t>0&&t<tWall){tWall=t;normal={x:1,y:0};} }
  if(dy>0){ const t=(H-CUSHION-BALL_R-oy)/dy; if(t>0&&t<tWall){tWall=t;normal={x:0,y:-1};} }
  if(dy<0){ const t=(CUSHION+BALL_R-oy)/dy; if(t>0&&t<tWall){tWall=t;normal={x:0,y:1};} }

  // 碰球距离（射线与圆）
  let tBall = Infinity, hitBall=null;
  for(const b of balls){
    if(!b.active || b.cue) continue;
    const fx=b.x-ox, fy=b.y-oy;
    const proj=fx*dx+fy*dy;
    if(proj<0) continue;
    const perp2=fx*fx+fy*fy-proj*proj;
    const r=b.r+BALL_R;
    if(perp2<r*r){
      const t=proj-Math.sqrt(r*r-perp2);
      if(t>0 && t<tBall){ tBall=t; hitBall=b; }
    }
  }

  if(tBall<tWall){
    return {x:ox+dx*tBall, y:oy+dy*tBall, type:'ball', ball:hitBall};
  }
  return {x:ox+dx*tWall, y:oy+dy*tWall, type:'cushion', normal};
}

function line(x1,y1,x2,y2){
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function ballsMoving(){
  return balls.some(b=>b.active && (Math.hypot(b.vx,b.vy)>REST_SPEED));
}

/* ================= 主循环 ================= */
function loop(){
  // 按住蓄力期间，力度随时间匀速上涨（不依赖鼠标移动）
  if(aiming){
    power = Math.min(1, (performance.now()-holdStart)/650);
  }
  const moving = stepPhysics();
  stepParticles();
  if(startTime!=null && !moving) elapsed = performance.now()-startTime;
  if(startTime!=null && moving) elapsed = performance.now()-startTime;
  drawTable();
  updateHud();
  checkWin();
  raf = requestAnimationFrame(loop);
}

function checkWin(){
  if(balls.every(b=>!b.active || b.cue)){
    stopTime();
    showOverlay();
  }
}

function stopTime(){ if(startTime!=null) elapsed = performance.now()-startTime; }

/* ================= HUD ================= */
function updateHud(){
  document.getElementById('statTime').textContent = fmtTime(elapsed);
  document.getElementById('statPotted').textContent = potted;
  document.getElementById('statLeft').textContent = balls.filter(b=>b.active&&!b.cue).length;
  document.getElementById('statShots').textContent = shots;
}

function showOverlay(){
  const total = balls.filter(b=>!b.cue).length;
  document.getElementById('finalTime').textContent = fmtTime(elapsed);
  document.getElementById('finalPotted').textContent = potted;
  document.getElementById('finalShots').textContent = shots;
  document.getElementById('finalAvg').textContent = (potted? (elapsed/1000/potted):0).toFixed(1)+'s';
  document.getElementById('overlay').classList.add('show');
}

/* ================= 交互 ================= */
function canvasPos(e){
  const r = canvas.getBoundingClientRect();
  const src = (e.touches && e.touches.length) ? e.touches[0] : e;
  const cx = src.clientX!=null?src.clientX:0, cy = src.clientY!=null?src.clientY:0;
  return { x:(cx-r.left)*W/r.width, y:(cy-r.top)*H/r.height };
}

let pointerDown = false;   // 指针是否处于按下状态（兜底标记）

// 按下：开始蓄力（鼠标左键 / 单指触屏 / 指针）
function pressStart(e){
  // 触屏/非左键直接忽略；左键 button===0
  if(e.button!=null && e.button!==0) return;
  if(ballsMoving()) return;
  if(e.cancelable) e.preventDefault();
  const p = canvasPos(e);
  aimAngle = Math.atan2(p.y-cue.y, p.x-cue.x);
  aiming = true;
  pointerDown = true;
  power = 0;
  holdStart = performance.now();
}
// 移动：只更新瞄准方向，力度在主循环里随时间上涨
function pressMove(e){
  if(!cue.active) return;
  const p = canvasPos(e);
  aimAngle = Math.atan2(p.y-cue.y, p.x-cue.x);
}
// 松开：出杆
function pressEnd(e){
  if(!aiming && !pointerDown) return;
  if(e && e.cancelable) e.preventDefault();
  aiming = false;
  pointerDown = false;
  if(!ballsMoving()){
    // 轻点也给一个最小力度，避免点一下完全没反应；按住越久力度越大
    const p = Math.max(power, 0.25);
    const v = MAX_POWER*p;
    cue.vx = Math.cos(aimAngle)*v;
    cue.vy = Math.sin(aimAngle)*v;
    shots++;
    if(startTime==null) startTime = performance.now();
  }
  power = 0;
}

// 按下绑在画布，移动/抬起绑在 window，避免拖出画布后丢抬起事件
canvas.addEventListener('mousedown', pressStart);
window.addEventListener('mousemove', pressMove);
window.addEventListener('mouseup', pressEnd);
window.addEventListener('blur', pressEnd);
// 触屏等价路径
canvas.addEventListener('touchstart', pressStart, {passive:false});
window.addEventListener('touchmove', pressMove, {passive:false});
window.addEventListener('touchend', pressEnd, {passive:false});
window.addEventListener('touchcancel', pressEnd, {passive:false});
// 指针事件兜底（兼容触控笔/新式输入）
canvas.addEventListener('pointerdown', pressStart);
window.addEventListener('pointermove', pressMove);
window.addEventListener('pointerup', pressEnd);
window.addEventListener('pointercancel', pressEnd);

document.getElementById('aimBtn').addEventListener('click', ()=>{
  showAid = !showAid;
  document.getElementById('aimBtn').textContent = '辅助线：'+(showAid?'开':'关');
});
document.getElementById('restartBtn').addEventListener('click', buildRack);
document.getElementById('againBtn').addEventListener('click', ()=>{
  document.getElementById('overlay').classList.remove('show');
  buildRack();
});
window.addEventListener('keydown', e=>{
  if(e.key==='Escape') buildRack();
});

/* ================= 启动 ================= */
buildRack();
loop();
</script>
</body>
</html>
